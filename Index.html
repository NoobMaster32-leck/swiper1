<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Song-Swiper</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#121212;color:#fff;padding:16px;max-width:480px;margin:auto}
h1{font-size:22px;margin:4px 0 12px}input,select,textarea,button{font:inherit;border-radius:10px;border:1px solid #333;background:#1e1e1e;color:#fff;padding:10px;width:100%}
button{cursor:pointer;background:#2a2a2a}button.g{background:#1db954;color:#000;font-weight:600;border:0}
.hid{display:none}.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips button{width:auto;padding:6px 12px;border-radius:20px;font-size:14px}
#card{background:#1e1e1e;border-radius:16px;padding:14px;text-align:center;margin:12px 0;touch-action:pan-y;transition:transform .15s}
#cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#333}
#title{font-size:20px;font-weight:700;margin:10px 0 2px}#sub{color:#aaa}
#bar{height:4px;background:#333;border-radius:2px;margin-top:10px;overflow:hidden}#bar div{height:100%;width:0;background:#1db954}
.btns{display:flex;justify-content:space-around;align-items:center;margin:10px 0}
.btns button{width:64px;height:64px;border-radius:50%;font-size:26px;padding:0}
#no{color:#ff5a5a}#yes{color:#1db954}#un,#pp{width:48px!important;height:48px!important;font-size:20px!important}
small,.m{color:#aaa;font-size:13px}code{background:#222;padding:2px 6px;border-radius:6px;word-break:break-all}a{color:#1db954}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#333;padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}
</style></head><body>
<div id="setup" class="hid">
<h1>Song-Swiper</h1>
<p class="m">Diese Adresse im Spotify-Dashboard als Redirect URI eintragen:</p>
<p><code id="redir"></code></p>
<input id="cid" placeholder="Spotify Client ID">
<div class="row"><button class="g" id="login">Mit Spotify anmelden</button></div>
</div>
<div id="plsel" class="hid">
<h1>Welche Playlist?</h1>
<select id="pls"></select>
<p class="m">oder neue Playlist anlegen:</p>
<input id="newpl" placeholder="Name, z. B. Meine Entdeckungen">
<div class="row"><button class="g" id="plgo">Weiter</button></div>
</div>
<div id="main" class="hid">
<div class="row" style="align-items:center"><div><b id="plname"></b><br><small id="stats"></small></div><button id="chg" style="flex:0 0 auto;width:auto">Playlist</button></div>
<div class="row"><input id="q" placeholder="Lust auf… (Coldplay, 80er, genre:rock)"><button id="qgo" style="flex:0 0 70px">Los</button></div>
<div class="chips" id="chips"></div>
<div id="card"><img id="cover" alt=""><div id="title">Tippe auf ▶</div><div id="sub"></div><div id="bar"><div></div></div><small id="info"></small></div>
<div class="btns"><button id="no">✕</button><button id="un">↺</button><button id="pp">▶</button><button id="yes">♥</button></div>
<details><summary class="m">Songliste einfügen</summary><textarea id="list" rows="6" placeholder="Künstler - Titel (eine Zeile pro Song)"></textarea><div class="row"><button id="listgo">Liste übernehmen</button></div></details>
<p class="m"><a id="open" target="_blank">In Spotify öffnen</a> · <a href="#" id="logout">Abmelden</a></p>
</div>
<audio id="au" preload="auto"></audio><div id="toast"></div>
<script>
const $=id=>document.getElementById(id),au=$('au');
const REDIR=location.origin+location.pathname;
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let CID=LS.get('cid',''),tok=LS.get('tok',{}),me=null,pl=LS.get('pl',null);
let seen=new Set(LS.get('seen',[])),queue=[],hist=[],pending=[],added=0,query=null,off=0,loading=false,unlocked=false;
const CHIPS={'Überrasch mich':'year:1970-2026','70er':'year:1970-1979','80er':'year:1980-1989','90er':'year:1990-1999','2000er':'year:2000-2009','2010er':'year:2010-2019','Neu':'year:2024-2026','Rock':'genre:rock','Pop':'genre:pop','Hip-Hop':'genre:hip-hop','Dance':'genre:dance','Indie':'genre:indie','Chill':'genre:chill','Deutsch':'genre:"german pop"'};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function view(v){['setup','plsel','main'].forEach(x=>$(x).classList.toggle('hid',x!==v))}
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2000)}
function rand(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>'abcdefghijklmnopqrstuvwxyz0123456789'[x%36]).join('')}
async function challenge(v){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return btoa(String.fromCharCode(...new Uint8Array(h))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function login(){const v=rand(64);localStorage.setItem('v',v);
 location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CID,response_type:'code',redirect_uri:REDIR,code_challenge_method:'S256',code_challenge:await challenge(v),scope:'playlist-modify-private playlist-modify-public playlist-read-private'})}
function saveTok(j){if(!j.access_token)throw new Error(j.error_description||j.error||'Anmeldung fehlgeschlagen');tok.a=j.access_token;tok.e=Date.now()+(j.expires_in-60)*1000;if(j.refresh_token)tok.r=j.refresh_token;LS.set('tok',tok)}
async function tokenReq(p){const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CID,...p})});saveTok(await r.json())}
async function access(){if(tok.a&&Date.now()<tok.e)return tok.a;if(!tok.r)throw new Error('Bitte neu anmelden');await tokenReq({grant_type:'refresh_token',refresh_token:tok.r});return tok.a}
async function api(path,opt={}){const r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+await access(),'Content-Type':'application/json'}});
 if(r.status===429)throw new Error('Zu viele Anfragen, kurz warten');const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error?.message||r.status);return j}
let jn=0;
function itunes(term){return new Promise(res=>{const cb='itcb'+(jn++),s=document.createElement('script');
 const done=v=>{clearTimeout(t);delete window[cb];s.remove();res(v)},t=setTimeout(()=>done(null),7000);
 window[cb]=d=>done(d);s.onerror=()=>done(null);
 s.src='https://itunes.apple.com/search?'+new URLSearchParams({term,entity:'song',limit:'5',country:'DE',callback:cb});document.body.appendChild(s)})}
function preview(t){if(!t.pv)t.pv=itunes(t.a1+' '+t.name.replace(/\s+[-–(\[].*$/,'')).then(d=>{const r=d?.results||[],a=t.a1.toLowerCase();
 const hit=r.find(x=>x.previewUrl&&(x.artistName||'').toLowerCase().includes(a.split(' ')[0]))||r.find(x=>x.previewUrl);return hit?hit.previewUrl:null});return t.pv}
function push(t){if(!t||seen.has(t.uri)||queue.some(x=>x.uri===t.uri))return;
 queue.push({uri:t.uri,name:t.name,artist:t.artists.map(a=>a.name).join(', '),a1:t.artists[0]?.name||'',year:(t.album?.release_date||'').slice(0,4),img:t.album?.images?.[0]?.url||'',url:t.external_urls?.spotify})}
async function loadMore(){if(loading)return;loading=true;
 try{if(pending.length){for(const l of pending.splice(0,10)){try{const d=await api('/search?'+new URLSearchParams({q:l,type:'track',limit:'1',market:'DE'}));push(d.tracks?.items?.[0])}catch(e){}}}
 else if(query){for(let i=0;i<2;i++){const d=await api('/search?'+new URLSearchParams({q:query,type:'track',limit:'10',offset:String(off),market:'DE'}));off+=10;
  const it=d.tracks?.items||[];if(!it.length){off=0;break}it.forEach(push)}}}
 catch(e){toast('Fehler: '+e.message)}loading=false}
async function render(play){
 let n=0;while(!queue.length&&n<5&&(pending.length||query)){await loadMore();n++}
 const t=queue[0];
 if(!t){$('title').textContent='Keine Songs mehr';$('sub').textContent='Wähl oben eine neue Richtung.';$('cover').removeAttribute('src');au.pause();return}
 $('cover').src=t.img;$('title').textContent=t.name;$('sub').textContent=t.artist+(t.year?' · '+t.year:'');$('open').href=t.url;$('info').textContent='Lädt…';
 if(queue.length<6)loadMore();queue.slice(1,4).forEach(preview);
 const pv=await preview(t);if(queue[0]!==t)return;
 if(!pv){$('info').textContent='Keine Hörprobe gefunden – über „In Spotify öffnen“ anhören';au.pause();return}
 $('info').textContent='';if(au.src!==pv)au.src=pv;if(play||unlocked)au.play().catch(()=>{});}
function stats(){$('stats').textContent=`${added} hinzugefügt · ${seen.size} bewertet`}
async function decide(yes){unlocked=true;const t=queue.shift();if(!t)return;seen.add(t.uri);LS.set('seen',[...seen]);hist.push({t,yes});
 if(yes)api(`/playlists/${pl.id}/items`,{method:'POST',body:JSON.stringify({uris:[t.uri]})}).then(()=>{added++;stats();toast('♥ '+t.name)}).catch(e=>toast('Fehler: '+e.message));
 stats();render(true)}
function newQuery(q,shuffle){query=q;off=shuffle?Math.floor(Math.random()*10)*10:0;queue=[];render(true)}
function mapQ(s){return s.replace(/\b([5-9])0er\b/gi,(m,d)=>`year:19${d}0-19${d}9`).replace(/\b20([0-2])0er\b/gi,(m,d)=>`year:20${d}0-20${d}9`)}
async function pickPl(){view('plsel');try{const d=await api('/me/playlists?limit=50');const own=(d.items||[]).filter(p=>p&&p.owner&&p.owner.id===me.id);
 $('pls').innerHTML='<option value="">– vorhandene wählen –</option>'+own.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}catch(e){toast('Fehler: '+e.message)}}
function startMain(){view('main');$('plname').textContent=pl.name;stats();$('chips').innerHTML='';
 for(const k in CHIPS){const b=document.createElement('button');b.textContent=k;b.onclick=()=>{unlocked=true;newQuery(CHIPS[k],true)};$('chips').appendChild(b)}
 if(!queue.length){query=CHIPS['Überrasch mich'];off=Math.floor(Math.random()*10)*10;render(false)}}
$('login').onclick=()=>{CID=$('cid').value.trim();if(!CID)return toast('Client ID fehlt');LS.set('cid',CID);login()};
$('plgo').onclick=async()=>{const n=$('newpl').value.trim();try{
 if(n){const p=await api('/me/playlists',{method:'POST',body:JSON.stringify({name:n,public:false,description:'Mit Song-Swiper erstellt'})});pl={id:p.id,name:p.name}}
 else{const s=$('pls');if(!s.value)return toast('Playlist wählen oder Namen eingeben');pl={id:s.value,name:s.options[s.selectedIndex].text}}
 LS.set('pl',pl);startMain()}catch(e){toast('Fehler: '+e.message)}};
$('chg').onclick=()=>{au.pause();localStorage.removeItem('pl');pl=null;pickPl()};
$('logout').onclick=e=>{e.preventDefault();localStorage.removeItem('tok');localStorage.removeItem('pl');location.href=REDIR};
$('qgo').onclick=()=>{const v=$('q').value.trim();if(!v)return toast('Erst etwas eingeben');unlocked=true;newQuery(mapQ(v),false)};
$('q').onkeydown=e=>{if(e.key==='Enter')$('qgo').click()};
$('yes').onclick=()=>decide(true);$('no').onclick=()=>decide(false);
$('pp').onclick=()=>{unlocked=true;if(au.paused){if(au.src)au.play().catch(()=>{});else render(true)}else au.pause()};
$('un').onclick=async()=>{const h=hist.pop();if(!h)return toast('Nichts zum Rückgängigmachen');seen.delete(h.t.uri);LS.set('seen',[...seen]);queue.unshift(h.t);
 if(h.yes){try{await api(`/playlists/${pl.id}/items`,{method:'DELETE',body:JSON.stringify({items:[{uri:h.t.uri}]})});added--}catch(e){toast('Konnte nicht entfernen: '+e.message)}}stats();render(true)};
$('listgo').onclick=()=>{const ls=$('list').value.split('\n').map(l=>l.replace(/^\s*\d+[.)]\s*/,'').replace(/\s+[–-]\s+/,' ').trim()).filter(Boolean);
 if(!ls.length)return toast('Liste ist leer');pending.push(...ls);$('list').value='';queue=[];unlocked=true;toast(ls.length+' Songs übernommen');render(true)};
au.ontimeupdate=()=>{document.querySelector('#bar div').style.width=(au.duration?au.currentTime/au.duration*100:0)+'%'};
au.onplay=()=>$('pp').textContent='❚❚';au.onpause=()=>$('pp').textContent='▶';
let sx=null;const card=$('card');
card.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
card.addEventListener('touchmove',e=>{if(sx!==null){const dx=e.touches[0].clientX-sx;card.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`}},{passive:true});
card.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;card.style.transform='';if(dx>80)decide(true);else if(dx<-80)decide(false)});
(async()=>{$('redir').textContent=REDIR;$('cid').value=CID;
 const code=new URLSearchParams(location.search).get('code');
 try{if(code){await tokenReq({grant_type:'authorization_code',code,redirect_uri:REDIR,code_verifier:localStorage.getItem('v')});history.replaceState({},'',REDIR)}
  if(!tok.r){view('setup');return}
  me=await api('/me');if(!pl){await pickPl();return}startMain()}
 catch(e){toast('Fehler: '+e.message);view('setup')}})();
</script></body></html>
